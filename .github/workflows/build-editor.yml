name: Build Editor

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-editor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Install dependencies
        run: "& \"$env:VCPKG_INSTALLATION_ROOT\\vcpkg.exe\" install --triplet x64-windows"
      - name: Configure
        run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_MANIFEST_MODE=ON
      - name: Build editor (Release)
        run: cmake --build build --config Release --target ksge_editor
      - name: Smoke test
        run: build\Release\ksge_editor.exe --selftest