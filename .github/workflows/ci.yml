name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        config: [Debug, Release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Install dependencies
        run: "& \"$env:VCPKG_INSTALLATION_ROOT\\vcpkg.exe\" install --triplet x64-windows"
      - name: Configure
        run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_MANIFEST_MODE=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.config }}
      - name: Smoke test
        run: build\${{ matrix.config }}\ksge_editor.exe --selftest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Install dependencies
        run: "& \"$env:VCPKG_INSTALLATION_ROOT\\vcpkg.exe\" install --triplet x64-windows"
      - name: Configure
        run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_MANIFEST_MODE=ON
      - name: Build (Release)
        run: cmake --build build --config Release
      - name: Smoke test
        run: build\Release\ksge_editor.exe --selftest
      - name: Package artifacts
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item build\Release\ksge_editor.exe dist\
          Compress-Archive -Path dist\* -DestinationPath KSGE-${{ github.ref_name }}.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: KSGE-*.zip
          generate_release_notes: true