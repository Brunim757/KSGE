name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        config: [Debug, Release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Install dependencies
        run: & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows
      - name: Configure
        run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_MANIFEST_MODE=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.config }}
      - name: Smoke test
        run: build\${{ matrix.config }}\ksge_editor.exe