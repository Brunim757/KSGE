name: Build Export

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Install dependencies
        run: & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows
      - name: Configure
        run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_MANIFEST_MODE=ON
      - name: Build exporter (Release)
        run: cmake --build build --config Release --target ksge_exporter
      - name: Export smoke test
        run: build\Release\ksge_exporter.exe --self-test